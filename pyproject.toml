[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-logger-backend"
version = "0.1.0"
description = "LangGraph-based health data logging system with natural language processing"
authors = [
    {name = "Health Logger Team", email = "team@healthlogger.dev"},
]
dependencies = [
    "langgraph>=0.0.55",
    "pyairtable>=2.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.2",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "pytz>=2023.3",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["E501", "COM812", "ISC001"]
target-version = "py310"
line-length = 88

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "TRY301"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"